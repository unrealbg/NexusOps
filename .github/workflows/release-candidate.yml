name: Release candidate provenance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact clean source
        run: node tools/release/verify-release-source.mjs
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      # actions-rust-lang/setup-rust-toolchain v1.16.1
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          cache: false
          rustflags: ''
      - run: npm ci
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --bins --locked -q
      - run: cargo test -p nexus-ssh --test loopback --locked
      - run: npm run release:verify
      - run: cargo run -p nexus-core --example export_protocol --locked -- --check
      - name: Build production executable (Windows)
        if: runner.os == 'Windows'
        run: .\node_modules\.bin\tauri.cmd build --no-bundle -- --locked
      - name: Build production executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./node_modules/.bin/tauri build --no-bundle -- --locked
      - name: Stage only the production executable
        id: stage
        shell: bash
        run: |
          canonical_temp="$(node --input-type=module -e 'import { realpathSync } from "node:fs"; process.stdout.write(realpathSync(process.env.RUNNER_TEMP));')"
          node tools/release/stage-release-candidate.mjs --stage "$canonical_temp/nexusops-release-stage"
      - name: Create and verify deterministic manifest
        shell: bash
        env:
          STAGE_DIR: ${{ steps.stage.outputs.stage_dir }}
        run: |
          node tools/release/create-release-manifest.mjs --stage "$STAGE_DIR"
          node tools/release/verify-release-manifest.mjs --stage "$STAGE_DIR"
      # actions/attest v4; the manual run would publish GitHub/Sigstore provenance.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ steps.stage.outputs.binary_path }}
            ${{ steps.stage.outputs.stage_dir }}/release-manifest.json
      # actions/upload-artifact v4; upload only the verified, flat staging directory.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ steps.stage.outputs.stage_dir }}/*
          if-no-files-found: error
          compression-level: 0
